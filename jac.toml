[project]
name = "journeys"
version = "1.0.0"
description = "A little further every day: conversational journeys and daily progress"
jac-version = "==0.37.23"
default-app = "journeys"

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[client.app_meta_data]
title = "Journeys · A little further, every day"
description = "Your daily compass for learning, showing up and remembering your progress."
theme_color = "#41624a"

[client.pwa]
enabled = true
theme_color = "#41624a"

[placement.pins]
"core.*" = "server"

[apps.journeys]
kind = "web-app"
entry-point = "main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.mobile.dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-native-web = "^0.19.13"
react-native-svg = "^15.13.0"
lucide-react = "^0.469.0"
lucide-react-native = "^0.469.0"

[apps.mobile.dependencies.npm.native]
react-native-svg = "^15.13.0"
lucide-react-native = "^0.469.0"
expo-notifications = "~57.0.21"
expo-secure-store = "~57.0.4"

[apps.cli]
kind = "cli"
entry-point = "cli.main"

[test]
directory = "tests"

[serve]
host = "127.0.0.1"
port = 8000
